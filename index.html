<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoryApp - Recordatorios Inteligentes</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="map"></div>

    <aside class="sidebar">
        <h1>MemoryApp</h1>

        <div class="search-container">
            <input type="text" id="address-search" class="search-box" placeholder="Buscar dirección (Nominatim)...">
            <div id="search-results" class="search-results-dropdown"></div>
        </div>

        <div class="reminders-section">
            <h2 style="font-size: 1rem; margin-bottom: 1rem; color: var(--text-muted);">MIS RECORDATORIOS</h2>
            <div id="reminders-list" class="reminders-list">
                <!-- Se cargarán dinámicamente -->
                <div class="reminder-card">
                    <div class="reminder-title">Bienvenido a MemoryApp</div>
                    <div class="reminder-info">Haz clic en el mapa para añadir tu primer recordatorio de ubicación.
                    </div>
                </div>
            </div>
        </div>

        <button class="btn-add" id="btn-simulate-location">Simular Mi Ubicación</button>
    </aside>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>

</html>
